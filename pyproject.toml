[project]
name = "eu-hack-scout"
version = "0.1.0"
description = "Daily digest of Bucharest, European in-person, and online hackathons"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
euhackscout = "euhackscout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["euhackscout*"]
