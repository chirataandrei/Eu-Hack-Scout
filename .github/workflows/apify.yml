name: Apify refresh (Bucharest discovery)

on:
  schedule:
    - cron: "30 3,11,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apify
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Apify cache
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m euhackscout apify-refresh ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Persist Apify artifacts
        run: |
          git config user.name "euhackscout-bot"
          git config user.email "euhackscout-bot@users.noreply.github.com"
          git add data/apify_cache.json data/apify_state.json
          if git diff --staged --quiet; then
            echo "No Apify artifact changes"
          else
            git commit -m "chore: refresh Apify hackathon cache"
            git pull --rebase origin main
            git push
          fi
